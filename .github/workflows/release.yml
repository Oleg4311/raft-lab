name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 9.0.x
      - name: Версия в проекте должна совпадать с тегом
        run: test "v$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)" = "$GITHUB_REF_NAME"
      - run: dotnet test -c Release
      - name: Сборка автономных исполняемых файлов
        run: |
          mkdir -p dist
          for rid in win-x64 linux-x64 osx-arm64; do
            dotnet publish src/RaftLab.Cli -c Release -r "$rid" --self-contained -p:PublishSingleFile=true -p:DebugType=none -o "pub/$rid"
            name="raftlab-${GITHUB_REF_NAME}-$rid"
            mkdir -p "pack/$name"
            cp pub/$rid/raftlab* "pack/$name/"
            cp README.md LICENSE "pack/$name/"
            if [ "$rid" = win-x64 ]; then (cd pack && zip -qr "../dist/$name.zip" "$name"); else tar -C pack -czf "dist/$name.tar.gz" "$name"; fi
          done
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Подтверждение происхождения (provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* --title "raft-lab $GITHUB_REF_NAME"
          --notes "Автономные файлы raftlab для Windows, Linux и macOS (ставить .NET не нужно): перебор зёрен, прогон с отчётом, запись сценариев. Просмотрщик: https://oleg4311.github.io/raft-lab/. Проверьте SHA-256 из SHA256SUMS и аттестацию: gh attestation verify <файл> --repo Oleg4311/raft-lab."
