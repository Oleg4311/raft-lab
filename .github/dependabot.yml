version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-deps:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget-deps:
        patterns: ["*"]
